info:
  name: Get Products
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/v1/inventory/products?filter=ha"
  params:
    - name: filter
      value: ha
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
